[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monique"
version = "0.7.0"
description = "MONitor Integrated QUick Editor — graphical monitor configurator for Hyprland and Sway with drag-and-drop and auto-profile daemon"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "PyGObject>=3.46",
]

[project.optional-dependencies]
udev = ["pyudev>=0.24"]
test = ["pytest>=7.0"]

[project.scripts]
monique = "monique.app:main"
moniqued = "monique.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from the source tree: the tested modules pull in no GTK, so the suite
# runs without PyGObject and its system libraries.
pythonpath = ["src"]
